name: Release candidate

on:
  workflow_dispatch:
    inputs:
      quality_report_url:
        description: HTTPS URL of the immutable production quality report
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ATM_UPLOAD_KEYSTORE: ${{ github.workspace }}/upload-keystore.jks
      ATM_UPLOAD_KEY_ALIAS: ${{ secrets.ATM_UPLOAD_KEY_ALIAS }}
      ATM_UPLOAD_STORE_PASSWORD: ${{ secrets.ATM_UPLOAD_STORE_PASSWORD }}
      ATM_UPLOAD_KEY_PASSWORD: ${{ secrets.ATM_UPLOAD_KEY_PASSWORD }}
      MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
      ATM_SUPPORT_EMAIL: ${{ secrets.ATM_SUPPORT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.7"
          channel: stable
          cache: true
      - name: Materialize upload keystore
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.ATM_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          test -n "$UPLOAD_KEYSTORE_BASE64"
          printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$ATM_UPLOAD_KEYSTORE"
      - name: Validate injected release values
        run: |
          test -n "$ATM_UPLOAD_KEY_ALIAS"
          test -n "$ATM_UPLOAD_STORE_PASSWORD"
          test -n "$ATM_UPLOAD_KEY_PASSWORD"
          test -n "$MAPS_API_KEY"
          test -n "$ATM_SUPPORT_EMAIL"
          test "$ATM_SUPPORT_EMAIL" != "support@example.com"
      - run: python -m pip install -e pipeline
      - name: Python tests and release-readiness
        run: python -m pytest pipeline/tests -q
      - working-directory: app
        run: flutter pub get
      - working-directory: app
        run: flutter gen-l10n
      - working-directory: app
        run: flutter analyze
      - working-directory: app
        run: flutter test --concurrency=1 --exclude-tags production-performance
      - working-directory: app
        run: flutter test test/production_performance_gate_test.dart
      - name: Build signed and obfuscated AAB
        working-directory: app
        run: |
          flutter build appbundle --release \
            --build-name=1.0.0 \
            --build-number=1 \
            --obfuscate \
            --split-debug-info=../release-out/symbols \
            --dart-define=ATM_SUPPORT_EMAIL="$ATM_SUPPORT_EMAIL"
      - name: Assemble immutable candidate
        run: |
          mkdir -p release-out
          cp app/build/app/outputs/bundle/release/app-release.aab release-out/
          cp app/build/app/outputs/mapping/release/mapping.txt release-out/
          cp -R performance/reports release-out/performance-reports
          curl --fail --location --proto '=https' \
            '${{ inputs.quality_report_url }}' \
            --output release-out/quality-report.json
          printf 'revision=%s\nworkflow=%s\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" > release-out/test-summary.txt
          find release-out -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum > release-out/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: atm-finder-1.0.0-rc-${{ github.run_number }}
          path: release-out/
          if-no-files-found: error
          retention-days: 90
