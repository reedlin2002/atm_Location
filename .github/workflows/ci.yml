name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - run: python -m pip install -e pipeline
      - run: python -m pytest pipeline/tests -q

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.7"
          channel: stable
          cache: true
      - working-directory: app
        run: flutter pub get
      - working-directory: app
        run: flutter gen-l10n
      - working-directory: app
        run: flutter analyze
      - working-directory: app
        run: flutter test --concurrency=1 --exclude-tags production-performance

  production-performance:
    runs-on: ubuntu-latest
    needs: [pipeline, flutter]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.7"
          channel: stable
          cache: true
      - working-directory: app
        run: flutter pub get
      - working-directory: app
        run: flutter test test/production_performance_gate_test.dart
      - uses: actions/upload-artifact@v4
        with:
          name: production-performance-report
          path: performance/reports/
          if-no-files-found: error
