name: Android minimum-tier performance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.7"
          channel: stable
          cache: true
      - working-directory: app
        run: flutter pub get
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android 10 / 2 GB performance gate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_3a
          cores: 2
          ram-size: 2048M
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -no-snapshot-save
          disable-animations: true
          script: >-
            pwsh -NoProfile -File scripts/run-android10-performance.ps1
            -DeviceId emulator-5554
            -FlutterCommand flutter
            -AndroidSdkRoot "$ANDROID_HOME"
      - uses: actions/upload-artifact@v4
        with:
          name: production-like-2026.07.26-android-api29-2gb
          path: |
            performance/reports/performance-production-like-2026.07.26-android-api29-2gb.json
            performance/reports/performance-production-like-2026.07.26-android-api29-2gb.md
            performance/reports/performance-production-like-2026.07.26-android-api29-2gb.log
          if-no-files-found: error
          retention-days: 90
